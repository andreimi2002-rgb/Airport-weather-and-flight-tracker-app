# Netlify reads this file from the repository root. It overrides the
# publish directory set in the Netlify UI. There is no build step.
[build]
  publish = "public"
  command = ""

# Server-side code (weather today). esbuild bundles the airport list into
# the function. Responses set their own cache headers in code.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Every airport has its own address, e.g. /airport/OTP.
# The single page app reads the code from the URL.
[[redirects]]
  from = "/airport/*"
  to = "/index.html"
  status = 200

# Every aircraft has its own page, e.g. /aircraft/YR-ASA.
[[redirects]]
  from = "/aircraft/*"
  to = "/aircraft.html"
  status = 200

# Wall board for a monitor or tablet, e.g. /board/OTP.
[[redirects]]
  from = "/board/*"
  to = "/board.html"
  status = 200

# Search pages: a route (/route/CDG-LAX), an airline (/airline/KLM), a flight (/flight/KL1377).
[[redirects]]
  from = "/route/*"
  to = "/route.html"
  status = 200

[[redirects]]
  from = "/airline/*"
  to = "/airline.html"
  status = 200

[[redirects]]
  from = "/flight/*"
  to = "/flight.html"
  status = 200
